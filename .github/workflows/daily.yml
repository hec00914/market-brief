name: 全球市場早報

on:
  schedule:
    # GitHub 使用 UTC 時間：UTC 週日～週四 23:30 = 台北週一～週五 07:30
    - cron: "30 22 * * 0-4"
  workflow_dispatch:   # 允許在網頁上手動按「Run workflow」立即執行

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-brief
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BRIEF_OUTPUT_DIR: docs
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 產生早報
        run: python daily_market_brief.py

      - name: 把報告存回 repo（保留歷史）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "早報 $(TZ=Asia/Taipei date +%F)" || echo "沒有新的變更"
          git push

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳網頁
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 發佈到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
